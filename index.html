<!DOCTYPE html>
<html lang="en" data-theme="void">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chayanth Suthahar</title>
<meta name="description" content="Mechanical Engineering student. Hardware design, robotics, and embedded systems.">

<script>
(function(){
  var h=document.documentElement;
  try{ if(sessionStorage.getItem('seen')) h.className+=' no-intro'; }catch(e){}
  try{
    var t=localStorage.getItem('theme');
    if(['void','paper','blueprint'].indexOf(t)>-1) h.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>

<style>
/* ============================================================
   PALETTES — the "+" cycles data-theme on <html>
   ============================================================ */
:root,
[data-theme="void"]{ --bg:#0B0B0C; --fg:#F4F4F2; --dim:#8C8C8E; --hair:#242427; --accent:#F4F4F2; }
[data-theme="paper"]{ --bg:#FAF8F3; --fg:#141312; --dim:#6E6A62; --hair:#DDD8CD; --accent:#141312; }
[data-theme="blueprint"]{ --bg:#0A1014; --fg:#EAF6F8; --dim:#6F8A92; --hair:#173038; --accent:#3FC9D6; }

:root{
  --grotesk:'Helvetica Neue','Helvetica','Arial',sans-serif;
  --pad:clamp(1.15rem,2.8vw,2.5rem);

  /* Description indent from the left edge. Raise to push right. */
  --indent:48%;

  /* Name stays on ONE line at every width. Re-check if the name changes. */
  --name-size:clamp(1.9rem,9.5vw,10rem);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--grotesk);
  -webkit-font-smoothing:antialiased;
  transition:background-color .45s ease,color .45s ease;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* ============================================================
   HERO LOCK
   ============================================================ */
.viewport{height:100svh;overflow:hidden}
.stage{
  height:100%;
  padding:var(--pad);
  display:grid;
  grid-template-rows:auto 1fr auto;
  transform-origin:0 0;
  will-change:transform;
  animation:camera 3.8s cubic-bezier(.7,0,.25,1) both;
}
.settled .stage{will-change:auto}

/* ---- three-beat camera: name → description → full ---- */
@keyframes camera{
  0%,  24% { transform:translate(-4%, 3.2%)  scale(1.18) }
  44%, 66% { transform:translate(-25%, -18%) scale(1.16) }
  100%     { transform:translate(0,0)        scale(1)    }
}

/* ---------- header: language (left) + nav (right), then name ---------- */
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  opacity:0;animation:fade .8s ease 3.1s forwards;
}
.lang{display:flex;gap:.9rem;font-size:.8125rem;letter-spacing:.04em}
.lang button{color:var(--dim);transition:color .2s}
.lang button:hover{color:var(--fg)}
.lang button[aria-pressed="true"]{color:var(--fg)}

.corner{display:flex;align-items:center;gap:1.5rem;font-size:.8125rem}
.corner a{
  color:var(--dim);padding-bottom:.15rem;
  border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;
}
.corner a:hover,.corner a:focus-visible{color:var(--fg);border-bottom-color:var(--fg)}

.name{
  margin:.2em 0 0;
  font-weight:500;
  font-size:var(--name-size);
  line-height:.95;
  letter-spacing:-.04em;
  white-space:nowrap;
  padding-bottom:.1em;
  overflow:hidden;
}
.name > span{
  display:inline-block;
  transform:translateY(115%);
  animation:rise 1s cubic-bezier(.16,1,.3,1) .15s both;
}

/* ============================================================
   CENTER — asymmetric grid
   ============================================================ */
.center{
  align-self:center;
  display:grid;
  grid-template-columns:var(--indent) 1fr auto;
  align-items:start;
  column-gap:clamp(1.25rem,3vw,2.5rem);
  row-gap:2.5rem;
}

.sayhi{
  margin:0;font-weight:500;
  font-size:clamp(1.25rem,3.4vw,2.1rem);
  line-height:1.04;letter-spacing:-.03em;
  opacity:0;animation:fade .7s ease 1.35s forwards;
}
.sayhi a{transition:opacity .2s}
.sayhi > a{text-decoration:underline;text-underline-offset:.14em;text-decoration-thickness:.05em}
.sayhi > a:hover{opacity:.55}
.sayhi sup{font-size:.34em;letter-spacing:.06em;vertical-align:super;margin-left:.35em}
.sayhi sup a{color:var(--dim)}
.sayhi sup a:hover{color:var(--fg)}

.tagline{
  margin:0;font-weight:500;
  font-size:clamp(1.25rem,3.4vw,2.1rem);
  line-height:1.04;
  letter-spacing:-.03em;
}
.tagline .line{display:block;overflow:hidden;padding-bottom:.04em}
.tagline .line > span{
  display:block;transform:translateY(115%);
  animation:rise .85s cubic-bezier(.16,1,.3,1) both;
}
.tagline .line:nth-child(1) > span{animation-delay:1.35s}
.tagline .line:nth-child(2) > span{animation-delay:1.43s}
.tagline .line:nth-child(3) > span{animation-delay:1.51s}
.tagline .line:nth-child(4) > span{animation-delay:1.59s}
.tagline em{font-style:normal;color:var(--dim)}

.swatch{
  justify-self:end;align-self:start;
  font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:.8;
  color:var(--fg);
  opacity:0;animation:fade .8s ease 3.1s forwards;
  transition:transform .3s cubic-bezier(.16,1,.3,1),color .45s ease;
}
.swatch:hover,.swatch:focus-visible{transform:rotate(90deg)}
.swatch:active{transform:rotate(90deg) scale(.9)}

/* ---------- footer ---------- */
.meta{
  display:flex;justify-content:space-between;align-items:baseline;
  flex-wrap:wrap;gap:.75rem 1.5rem;
  font-size:.8125rem;color:var(--dim);
  opacity:0;animation:fade .9s ease 3.1s forwards;
}
.credits{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem}
.credits b{color:var(--fg);font-weight:500}
.clock{display:inline-flex;align-items:center;gap:.6rem;white-space:nowrap}
.clock b{color:var(--fg);font-weight:500;letter-spacing:.04em}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite}

@keyframes rise{to{transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- skip on repeat visits this session ---------- */
.no-intro .stage{animation:none}
.no-intro .name > span,
.no-intro .tagline .line > span{transform:none;animation:none}
.no-intro .topbar,.no-intro .sayhi,.no-intro .swatch,.no-intro .meta{opacity:1;animation:none}

/* ---------- release the lock only when it truly can't fit ---------- */
@media (max-width:768px),(max-height:480px){
  .viewport{height:auto;overflow:visible}
  .stage{height:auto;min-height:100svh;animation:none;transform:none}

  /* the name must be allowed to wrap on a phone, or it overflows the edge */
  .name{white-space:normal;font-size:clamp(2.4rem,15vw,5rem);line-height:.92}

  /* single column: say hi, then the tagline, with the + on its own row */
  .center{grid-template-columns:1fr;row-gap:1.5rem}
  .sayhi{grid-column:1;order:-1;animation-delay:.2s}
  .tagline{font-size:clamp(1.35rem,6vw,2rem)}
  .swatch{justify-self:start;align-self:auto;order:1;margin-top:.25rem}

  .tagline .line:nth-child(1) > span{animation-delay:.3s}
  .tagline .line:nth-child(2) > span{animation-delay:.38s}
  .tagline .line:nth-child(3) > span{animation-delay:.46s}
  .tagline .line:nth-child(4) > span{animation-delay:.54s}
  .topbar,.swatch,.meta{animation-delay:.7s}
}

/* phones: stack the top bar into two tidy rows — links, then language */
@media (max-width:600px){
  .topbar{flex-wrap:wrap;gap:.5rem 1rem}
  .corner{order:1;width:100%;justify-content:flex-start;gap:1.4rem}
  .lang{order:2;width:100%;justify-content:flex-start}
}

@media (prefers-reduced-motion:reduce){
  .stage{animation:none}
  .name > span,.tagline .line > span{transform:none;animation:none}
  .topbar,.sayhi,.swatch,.meta{opacity:1;animation:none}
  .dot{animation:none}
  .swatch,body{transition:none}
}
/* ---------- page transition curtain ---------- */
.curtain{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  opacity:1;pointer-events:none;
  transition:opacity .5s ease;
}
.curtain.clear{opacity:0}
@media (prefers-reduced-motion:reduce){ .curtain{transition:none} }
</style>
</head>
<body>

<div class="curtain" id="curtain"></div>

<div class="viewport">
  <main class="stage">

    <header>
      <div class="topbar">
        <nav class="lang" aria-label="Language">
          <button data-lang="en" aria-pressed="true">EN</button>
          <button data-lang="ta" aria-pressed="false">TA</button>
          <button data-lang="fr" aria-pressed="false">FR</button>
        </nav>
        <nav class="corner" aria-label="Primary">
          <!-- resume lives at "ChayanthResume (1).pdf" in this folder -->
          <a class="js-resume" href="ChayanthResume%20(1).pdf" target="_blank" rel="noopener">Resume</a>
          <a class="js-connect" href="https://www.linkedin.com/in/chayanth/" target="_blank" rel="noopener">connect</a>
          <a class="js-gh" href="#" aria-label="GitHub">GH</a>
        </nav>
      </div>

      <h1 class="name"><span>Chayanth Suthahar</span></h1>
    </header>

    <section class="center">
      <p class="sayhi">
        <a class="js-projects" href="projects.html">Projects</a>
      </p>

      <p class="tagline">
        <span class="line"><span></span></span>
        <span class="line"><span></span></span>
        <span class="line"><span></span></span>
        <span class="line"><span></span></span>
      </p>

      <button class="swatch" id="swatch" aria-label="Change colour theme" title="Change colour">+</button>
    </section>

    <footer class="meta">
      <div class="credits"><span></span><span></span><span></span></div>
      <div class="clock">
        <b>TORONTO</b> <time id="clock" datetime="">—</time>
        <span class="dot" aria-hidden="true"></span>
      </div>
    </footer>

  </main>
</div>

<script>
try{ sessionStorage.setItem('seen','1'); }catch(e){}

/* ============================================================
   LANGUAGE
   Proper nouns (name, FRC 2056, Sandbox, Hammer Hacks, GH) stay
   as-is. Everything else is swapped from this dictionary.
   ============================================================ */
var I18N = {
  en: {
    connect:'connect', projects:'Projects', resume:'Resume',
    lines:[
      'mechanical engineering student',
      'hardware, robotics &amp; embedded systems',
      '<em>currently in</em> mississauga',
      '<em>building with</em> frc 2056 &amp; sandbox'
    ],
    credits:[
      'Strategy Lead at <b>FRC 2056</b>',
      'Co-founder at <b>Sandbox</b>',
      'Ops at <b>Hammer Hacks</b>'
    ]
  },
  ta: {
    connect:'தொடர்பு', projects:'திட்டங்கள்', resume:'சுயவிவரம்',
    lines:[
      'இயந்திரப் பொறியியல் மாணவர்',
      'வன்பொருள், ரோபோட்டிக்ஸ் &amp; உட்பொதிந்த அமைப்புகள்',
      '<em>தற்போது</em> மிசிசாகாவில்',
      'frc 2056 &amp; sandbox <em>உடன் உருவாக்குகிறேன்</em>'
    ],
    credits:[
      '<b>FRC 2056</b> இல் மூலோபாய தலைவர்',
      '<b>Sandbox</b> இணை நிறுவனர்',
      '<b>Hammer Hacks</b> செயல்பாடுகள்'
    ]
  },
  fr: {
    connect:'contact', projects:'Projets', resume:'CV',
    lines:[
      'étudiant en génie mécanique',
      'matériel, robotique et systèmes embarqués',
      '<em>actuellement à</em> mississauga',
      '<em>je bâtis avec</em> frc 2056 &amp; sandbox'
    ],
    credits:[
      'Responsable stratégie chez <b>FRC 2056</b>',
      'Cofondateur de <b>Sandbox</b>',
      'Opérations chez <b>Hammer Hacks</b>'
    ]
  }
};

(function () {
  var lines   = document.querySelectorAll('.tagline .line > span');
  var credits = document.querySelectorAll('.credits > span');
  var connect = document.querySelector('.js-connect');
  var projects= document.querySelector('.js-projects');
  var resume  = document.querySelector('.js-resume');
  var buttons = document.querySelectorAll('.lang button');

  function paint(lang) {
    var t = I18N[lang] || I18N.en;
    connect.textContent = t.connect;
    projects.textContent = t.projects;
    resume.textContent = t.resume;
    lines.forEach(function (el, i)   { el.innerHTML = t.lines[i]; });
    credits.forEach(function (el, i) { el.innerHTML = t.credits[i]; });
    document.documentElement.lang = lang;
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
    });
  }

  var start = 'en';
  try { var s = localStorage.getItem('lang'); if (I18N[s]) start = s; } catch (e) {}
  paint(start);

  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      paint(b.dataset.lang);
      try { localStorage.setItem('lang', b.dataset.lang); } catch (e) {}
    });
  });
})();

/* drop the compositor hint once the camera lands */
(function(){
  var s = document.querySelector('.stage');
  if (s) s.addEventListener('animationend', function (e) {
    if (e.animationName === 'camera') document.documentElement.className += ' settled';
  });
})();

/* ---- the "+" cycles the colour theme ---- */
(function () {
  var themes = ['void','paper','blueprint'];
  var i = themes.indexOf(document.documentElement.getAttribute('data-theme'));
  if (i < 0) i = 0;
  document.getElementById('swatch').addEventListener('click', function () {
    i = (i + 1) % themes.length;
    document.documentElement.setAttribute('data-theme', themes[i]);
    try{ localStorage.setItem('theme', themes[i]); }catch(e){}
  });
})();

/* ---- clock, fixed to Toronto ---- */
(function () {
  var el = document.getElementById('clock');
  function tick(){
    try{
      el.textContent = new Intl.DateTimeFormat('en-US',{
        timeZone:'America/Toronto', hour:'numeric', minute:'2-digit', hour12:true
      }).format(new Date());
    }catch(e){ el.textContent=''; }
  }
  tick(); setInterval(tick, 20000);
})();
</script>
<script>
/* ---- smooth crossfade between pages (dissolves through the bg colour) ---- */
(function(){
  var c=document.getElementById('curtain');
  if(!c) return;
  var reveal=function(){ c.classList.add('clear'); };
  requestAnimationFrame(function(){ requestAnimationFrame(reveal); });
  window.addEventListener('pageshow', function(e){ if(e.persisted) reveal(); });

  document.addEventListener('click', function(e){
    if(e.defaultPrevented || e.button!==0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest ? e.target.closest('a') : null;
    if(!a || a.target==='_blank') return;
    var raw=a.getAttribute('href')||'';
    if(!raw || raw.charAt(0)==='#' || raw.indexOf('mailto:')===0) return;
    var url;
    try{ url=new URL(a.href); }catch(err){ return; }
    if(url.origin!==location.origin) return;
    if(!/\.html$/.test(url.pathname)) return;
    if(url.pathname===location.pathname){ return; }
    e.preventDefault();
    var target=a.href;
    c.classList.remove('clear');                    // cover
    var done=false, go=function(){ if(done)return; done=true; window.location.assign(target); };
    c.addEventListener('transitionend', go, {once:true});
    setTimeout(go, 600);                            // fallback
  });
})();
</script>
</body>
</html>
